<nav class="navbar" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a [routerLink]="['/storks/your-storks']" class="navbar-item">
      <img src="../../assets/stork-web-logo.png" width="112" height="28" />
    </a>

    <a
      role="button"
      class="navbar-burger"
      aria-label="menu"
      aria-expanded="false"
      data-target="storkNavbar"
    >
      <span aria-hidden="true"></span> <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div id="storkNavbar" class="navbar-menu">
    <div class="navbar-start">
      <a
        *ngIf="userIsAuthenticated"
        [routerLink]="['/storks/your-storks']"
        class="navbar-item"
      >
        All Storks
      </a>

      <a
        *ngIf="userIsAuthenticated"
        [routerLink]="['/storks/register-stork']"
        class="navbar-item"
      >
        Register A Stork
      </a>
    </div>

    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
          <a
            *ngIf="!userIsAuthenticated && router.url != '/sign-up'"
            [routerLink]="['/sign-up']"
            class="button is-primary"
          >
            <strong>Sign Up</strong>
          </a>
          <a
            *ngIf="!userIsAuthenticated && router.url === '/sign-up'"
            [routerLink]="['/login']"
            class="button is-primary"
          >
            <strong>Log In</strong>
          </a>
          <a
            *ngIf="userIsAuthenticated"
            (click)="onLogout()"
            class="button is-primary"
          >
            <strong>Log Out</strong>
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Get all "navbar-burger" elements
    const $navbarBurgers = Array.prototype.slice.call(
      document.querySelectorAll('.navbar-burger'),
      0
    );

    // Check if there are any navbar burgers
    if ($navbarBurgers.length > 0) {
      // Add a click event on each of them
      $navbarBurgers.forEach(el => {
        el.addEventListener('click', () => {
          // Get the target from the "data-target" attribute
          const target = el.dataset.target;
          const $target = document.getElementById(target);

          // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
          el.classList.toggle('is-active');
          $target.classList.toggle('is-active');
        });
      });
    }
  });
</script>
