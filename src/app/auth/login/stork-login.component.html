<section class="hero">
  <div class="hero-body">
    <div class="container has-text-centered">
      <div class="column is-4 is-offset-4">
        <h3 class="title has-text-grey">Login</h3>
        <p class="subtitle has-text-grey">Please Login to Proceed.</p>
        <div class="box">
          <form (submit)="onLogin(formLogin)" #formLogin="ngForm">
            <div class="field">
              <div class="control">
                <input
                  [class]="emailInput"
                  type="email"
                  ngModel
                  placeholder="Your Email"
                  autofocus=""
                  name="inputUserLoginEmail"
                  required
                />
              </div>
            </div>
            <div class="field">
              <div class="control">
                <input
                  [class]="passwordInput"
                  type="password"
                  ngModel
                  placeholder="Your Password"
                  name="inputUserLoginPassword"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label class="checkbox">
                <input type="checkbox" /> Remember Me
              </label>
            </div>
            <button
              type="submit"
              class="button is-block is-info is-large is-fullwidth"
            >
              Login
            </button>
          </form>
        </div>
        <p class="has-text-grey">
          <a [routerLink]="['/sign-up']">Sign Up</a> &nbsp;·&nbsp;
          <a [routerLink]="['/forget-password']">Forgot Password</a>
          &nbsp;·&nbsp; <a [routerLink]="['/help']">Need Help?</a>
        </p>
      </div>
    </div>
  </div>
</section>
