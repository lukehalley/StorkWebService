<section class="hero">
  <div class="hero-body">
    <div class="container has-text-centered">
      <div class="column is-4 is-offset-4">
        <h3 class="title has-text-grey">Sign Up.</h3>
        <p class="subtitle has-text-grey">Create A Stork Account.</p>
        <div class="box">
          <form (submit)="onSignUp(formSignup)" #formSignup="ngForm">
            <div class="field">
              <div class="control">
                <input
                  [class]="usernameInput"
                  ngModel
                  type="text"
                  autofocus=""
                  placeholder="Username"
                  name="inputUserSignUpUsername"
                  required
                />
              </div>
            </div>
            <div class="field">
              <div class="control">
                <input
                  [class]="emailInput"
                  ngModel
                  type="email"
                  placeholder="Email"
                  name="inputUserLoginEmail"
                  required
                />
              </div>
            </div>
            <div class="field">
              <div class="control">
                <input
                  [class]="passwordInput"
                  ngModel
                  type="password"
                  placeholder="Password"
                  name="inputUserLoginPassword"
                  required
                />
              </div>
            </div>
            <hr class="hr" style="margin: 10;" />
            <div class="field is-horizontal">
              <div class="field-body">
                <div class="field">
                  <div class="control">
                    <input
                      [class]="firstNameInput"
                      ngModel
                      type="text"
                      placeholder="First Name"
                      name="inputUserSignUpFName"
                      required
                    />
                  </div>
                </div>
                <div class="field">
                  <div class="control">
                    <input
                      [class]="secondNameInput"
                      ngModel
                      type="text"
                      placeholder="Second Name"
                      name="inputUserSignUpSName"
                      required
                    />
                  </div>
                </div>
              </div>
            </div>
            <div class="field">
              <div class="control">
                <input
                  [class]="addressInput"
                  ngModel
                  type="text"
                  placeholder="Address"
                  name="inputUserSignUpAddress"
                  required
                />
              </div>
            </div>
            <div class="field">
              <div class="control">
                <input
                  [class]="phoneNumberInput"
                  ngModel
                  type="tel"
                  placeholder="Phone Number"
                  name="inputUserSignUpPhoneNumber"
                />
              </div>
            </div>
            <p class="control">
              <button
                type="submit"
                class="button is-block is-info is-large is-fullwidth"
              >
                Sign Up
              </button>
            </p>
          </form>
        </div>
        <p class="has-text-grey">
          <a [routerLink]="['/login']">Login</a> &nbsp;·&nbsp;
          <a [routerLink]="['/help']">Need Help?</a>
        </p>
      </div>
    </div>
  </div>
</section>
