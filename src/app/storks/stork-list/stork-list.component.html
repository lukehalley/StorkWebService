<nav class="panel">
  <div *ngFor="let stork of storks">
    <div
      class="card"
      *ngIf="userIsAuthenticated && userId === stork.ownerId; else loggedOut"
    >
      <div class="card-content">
        <div class="media">
          <div class="media-left">
            <figure class="image is-48x48">
              <img
                src="https://bulma.io/images/placeholders/96x96.png"
                alt="Placeholder image"
              />
            </figure>
          </div>
          <div class="media-content">
            <p class="title is-4">{{ stork.nickname }}</p>
            <p class="subtitle is-6">{{ stork.stork_code }}</p>
          </div>
        </div>
        <div class="content">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. <br />
          <time datetime="2016-1-1">11:09 PM - 1 Jan 2016</time>
        </div>
      </div>
      <footer class="card-footer">
        <a class="card-footer-item" [routerLink]="['/edit', stork.id]">Edit</a>
        <a class="card-footer-item" (click)="onDelete(stork.id)">Delete</a>
      </footer>
    </div>
  </div>
  <ng-template #loggedOut>
    Please <strong>Login</strong> To See Your Storks
  </ng-template>
</nav>
